# GAZU gateway — site directives included by the unprivileged nginx image.
# Retains upstream routing; base image owns PID/temp permissions.
upstream api_upstream { server api:8000; }
  upstream web_upstream { server web:8080; }
  server {
    listen 8080;
    server_name _;
    client_max_body_size 6m;
    proxy_connect_timeout 4s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }
    # Privileged /internal/decision is never proxied; browser payment calls use Express.
    location /internal/ { return 404; }
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
