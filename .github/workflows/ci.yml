name: GAZU Phase 6 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            payment-service/package-lock.json
      - name: Install service dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix payment-service
      - name: Validate environment policy (no live secrets)
        run: |
          node scripts/auth-env.test.mjs
          node scripts/vite-env-policy.test.mjs
      - name: Architecture and Wave 1–3 compatibility regressions
        run: npm run verify:refactor
      - name: Payment service HTTP tests
        run: npm test --prefix payment-service
        env:
          NODE_ENV: test
      - name: Backend unit and replica-set integration tests
        run: npm test --prefix backend
        env:
          NODE_ENV: test
          MONGOMS_DOWNLOAD_IGNORE_MISSING_HEADER: 'true'
      - name: Frontend tests
        run: npm test --prefix frontend
      - name: Production React build
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: /api
          VITE_GOOGLE_CLIENT_ID: ''
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure nonproduction isolated Docker environment
        run: |
          cp .env.example .env
          sed -i 's/^MONGODB_URI=.*/MONGODB_URI=mongodb:\/\/unused.invalid\/ci/' .env
          sed -i 's/^GAZU_DB_MODE=.*/GAZU_DB_MODE=docker-local/' .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-only-jwt-secret-at-least-32-characters/' .env
          sed -i 's/^PAYMENT_SERVICE_SECRET=.*/PAYMENT_SERVICE_SECRET=ci-only-payment-secret-at-least-32-chars/' .env
          sed -i 's/^ENABLE_MOCK_PAYMENTS=.*/ENABLE_MOCK_PAYMENTS=true/' .env
          sed -i 's/^EMAIL_USER=.*/EMAIL_USER=/' .env
          sed -i 's/^EMAIL_PASS=.*/EMAIL_PASS=/' .env
          node scripts/check-root-env.mjs
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start isolated stack
        run: docker compose up -d --wait
      - name: Container and gateway smoke tests
        run: bash scripts/verify-phase6.sh
      - name: Collect sanitized container diagnostics on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=50 gateway web mongo mongo-init redis || true
      - name: Stop test stack (preserve volumes until runner disposal)
        if: always()
        run: docker compose down || true
