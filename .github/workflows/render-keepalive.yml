name: Keep Render backend awake

on:
  # Render Free spins down after 15 minutes without inbound traffic.
  # Run away from the top of the hour to reduce GitHub schedule contention.
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-backend-keepalive
  cancel-in-progress: false

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake and verify the GAZU API
        shell: bash
        env:
          HEALTH_URL: https://gazu-backend.onrender.com/api/health
        run: |
          set -u
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for attempt in {1..10}; do
            http_code="$(curl --silent --show-error --location \
              --connect-timeout 8 --max-time 15 \
              --output "$response_file" --write-out '%{http_code}' \
              "$HEALTH_URL" 2>/dev/null || true)"

            if [[ "$http_code" == "200" ]] && \
              grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "$response_file"; then
              echo "GAZU Render backend is healthy (HTTP 200)."
              exit 0
            fi

            echo "Render health attempt ${attempt}/10 returned HTTP ${http_code:-000}; retrying."
            sleep 5
          done

          echo "GAZU Render backend did not become healthy. Inspect the Render service Events and Logs."
          exit 1
